version: '3.8'

services:
  operonix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operonix
    ports:
      - "8000:8000"
    environment:
      # LLM Provider Configuration
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      
      # Application Configuration
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # CORS Configuration (update for production)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    volumes:
      # Mount for persistent data
      - operonix_logs:/home/operonix/app/logs
      - operonix_memory:/home/operonix/app/memory
      - operonix_plugins:/home/operonix/app/plugins/installed
      - operonix_data:/home/operonix/app/data
      # Mount .env file if it exists
      - ./.env:/home/operonix/app/.env:ro
    networks:
      - operonix_network
    restart: unless-stopped
    # For X11 forwarding (if running desktop automation)
    # environment:
    #   - DISPLAY=${DISPLAY:-:0}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Optional: Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: operonix_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - operonix_network
    restart: unless-stopped
    profiles:
      - with-ollama

networks:
  operonix_network:
    driver: bridge

volumes:
  operonix_logs:
    driver: local
  operonix_memory:
    driver: local
  operonix_plugins:
    driver: local
  operonix_data:
    driver: local
  ollama_data:
    driver: local
